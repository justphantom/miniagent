<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0d1117">
  <title>miniagent</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="login">
    <form id="login-form" autocomplete="off">
      <h1>miniagent</h1>
      <span id="version-login" class="muted" title="服务端版本"></span>
      <input id="key-input" type="password" placeholder="API Key" autocomplete="off">
      <button type="submit">进入</button>
      <p id="login-err"></p>
    </form>
  </div>

  <div id="app">
    <nav id="iconbar">
      <button id="icon-sessions" class="icon-btn" type="button" aria-label="对话" title="对话">💬</button>
      <button id="icon-new" class="icon-btn" type="button" aria-label="新建会话" title="新建会话">＋</button>
      <span class="flex-1"></span>
      <button id="icon-settings" class="icon-btn" type="button" aria-label="设置" title="设置">⚙</button>
    </nav>
    <header>
      <button id="menu-btn" class="ghost" type="button" aria-label="打开导航">☰</button>
      <h1>miniagent</h1>
      <span id="session-id" class="session-id muted" title="当前会话 ID"></span>
      <span id="session-workdir" class="session-id muted" title="当前会话工作目录"></span>
      <span id="session-tokens" class="session-id muted" title="当前会话累计 token"></span>
      <span class="flex-1"></span>
      <button id="theme-btn" class="ghost" type="button" title="切换到亮色" aria-label="切换主题">◐</button>
      <button id="logout" class="ghost">退出</button>
    </header>
    <div id="tabs">
      <button class="tab active" type="button" data-tab="chat">对话</button>
      <button class="tab" type="button" data-tab="trajectory">轨迹</button>
      <span class="flex-1"></span>
      <span id="tab-meta" class="muted tab-meta"></span>
    </div>
    <main>
      <div id="events" aria-live="polite" aria-label="对话内容"></div>
      <button id="to-bottom" type="button" title="回到底部" aria-label="回到底部">↓</button>
      <div id="session-panel" class="slide-panel" hidden>
        <div class="panel-head">
          <span class="panel-title">对话</span>
          <button id="panel-close" class="panel-close ghost" type="button" aria-label="关闭">✕</button>
        </div>
        <div class="panel-body">
          <div class="panel-search"><input id="session-search" type="search" placeholder="搜索会话…" aria-label="搜索会话"></div>
          <div id="session-list"></div>
        </div>
      </div>
    </main>
    <div id="status-bar" class="muted">
      <span id="status-metrics"></span>
      <span id="status-version" title="服务端版本"></span>
      <span id="status-model" title="当前模型"></span>
    </div>
    <div id="composer">
      <div class="composer-row main-row">
        <div id="prompt-wrap">
          <textarea id="prompt" placeholder="给智能体发消息（Enter 发送）" aria-label="输入"></textarea>
          <span id="wait" class="muted" hidden></span>
          <button id="send" type="button" aria-label="发送" title="发送（运行中点击停止）">➤</button>
        </div>
      </div>
      <details id="composer-adv">
        <summary>工作目录 · 模型</summary>
        <div class="composer-row adv-row">
          <input id="workdir" placeholder="工作目录（绝对路径）" aria-label="工作目录">
          <button id="workdir-browse" type="button" class="ghost" aria-label="浏览目录">📁</button>
          <select id="model" aria-label="模型"><option>默认模型</option></select>
        </div>
      </details>
    </div>
  </div>
  <div id="config-modal" class="modal" hidden>
    <div class="modal-panel cfg-modal-panel">
      <div class="modal-head">
        <span class="modal-title">配置管理</span>
        <span id="cfg-status" class="cfg-status"></span>
        <button id="cfg-close" class="ghost" type="button" aria-label="关闭">✕</button>
      </div>
      <div class="modal-body" id="config-body"></div>
    </div>
  </div>
  <div id="dirpicker" class="modal" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
