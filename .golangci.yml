# golangci-lint v2 configuration
#
# Design principles (referencing Go official + community experience):
#   1. The default 5 linters (errcheck/govet/ineffassign/staticcheck/unused) as the foundation,
#      covering the minimum checks recommended by the Go team.
#   2. Add "objective correctness" linters (bodyclose/errorlint/gosec/nilerr etc.) — these
#      catch real bugs or security issues, independent of project style, and should all be enabled.
#   3. Selectively enable "subjective style" linters, but with relaxed thresholds, consistent with the AGENTS.md philosophy of "moderate abstraction / only do
#      explicit requirements / self-explanatory naming"; do not enable those that conflict with Go idioms
#      (e.g. varnamelen bans short variable names `i`/`n`, wsl enforces blank-line style).
#   4. gosec false positives are silenced precisely in settings.gosec.excludes with reasons; no
#      global exclusions.
#   5. Do not enable nolintlint: it makes nolint comment maintenance cost explode; community consensus is to leave it off by default.
#   6. Platform scope: Linux/macOS only (Unix). platform.go uses //go:build !windows
#      to isolate setpgid/killpg/O_NOFOLLOW, with no windows fallback.
#
# Run: golangci-lint run
# Full: golangci-lint run --default=all (enables all linters, including those not listed in enable)

version: "2"

run:
  timeout: 5m
  # Test files are configured separately to avoid applying production-level strictness to test code.
  tests: true

linters:
  # default controls the default behavior of linters not explicitly mentioned in enable/disable.
  # standard = only the 5 recommended by the Go team; all = all linters; none = disable all.
  default: standard

  enable:
    # ===== Objective correctness (must-enable) =====
    - bodyclose        # HTTP response body must be closed; this project has heavy HTTP paths
    - errorlint        # enforce %w wrapping to preserve the errors.Is/As chain
    - nilerr           # catch the "err is non-nil but returns nil" anti-pattern
    - noctx            # HTTP requests must carry a ctx
    - contextcheck     # check whether functions use a non-inherited ctx
    - nilnesserr       # stricter nil-path analysis than nilerr
    - fatcontext       # detect nested context in loops/closures
    - durationcheck    # anti-pattern of multiplying two durations
    - canonicalheader  # HTTP headers must use canonical casing
    - nosprintfhostport # catch the sprintf anti-pattern of concatenating "host:port" into a URL
    - sqlclosecheck    # sql.Rows must be Closed (no sql in this project yet, kept for extension)
    - rowserrcheck     # sql.Rows must check Err()
    - makezero         # anti-pattern of combining make([]T, 0) with append
    - gocheckcompilerdirectives # //go: directive spelling check

    # ===== Security (must-enable, false positives precisely excluded in settings) =====
    - gosec

    # ===== Modernization (recommended, Go 1.21+ stdlib replacements) =====
    - modernize        # suggest using max/min/slices/std libs to replace older idioms
    - mirror           # suggest technical mirroring wrappers (e.g. bytes.NewBufferString)
    - exptostd         # functions from golang.org/x/exp that have entered the standard library
    - usestdlibvars    # use constants like http.StatusOK instead of magic numbers
    - predeclared      # avoid shadowing builtins (e.g. real/copy/new)
    - recvcheck        # receiver consistency (pointer/value)
    - unconvert        # remove redundant type conversions
    - perfsprint       # fmt.Sprintf performance hints (small string concatenation)

    # ===== Readability/style (selective, compatible with project philosophy) =====
    - unparam          # function parameters never used, remove
    - misspell         # spelling mistakes
    - dupword          # duplicate words in comments/strings
    - revive           # successor to golint, comprehensive style
    - gochecknoinits   # disable init() (project uses it deliberately, exceptions in exclusions)
    - importas         # import alias consistency
    - gochecksumtype   # sum type exhaustiveness (complete switch over enum)
    # goconst not enabled: map keys ("type"/"description") and JSON schema fields
    # recur by structural necessity; extracting constants would reduce readability. Role fields ("user"/"assistant")
    # could be extracted as standalone constants, but this is not forced via a linter.
    - bidichk          # Unicode bidirectional character injection attacks
    - asciicheck       # identifiers must be ASCII
    - copyloopvar      # Go 1.22+ loop variable semantics (project uses go 1.25, relevant)
    - intrange         # suggest using for range int
    - testifylint      # testify usage checks (project uses standard testing, no impact)
    - inamedparam      # interface methods must have named parameters
    - interfacebloat   # upper bound on interface method count
    - goprintffuncname # printf-style functions must be named ending in f
    - reassign         # redefining standard library variables (e.g. http.DefaultClient)
    - musttag          # struct fields must have json tags (already done in this project)

    # ===== Not enabled (conflicts with project philosophy) =====
    # - varnamelen    : bans short variable names, violates Go idioms (i/n/s/m)
    # - wsl / wsl_v5  : enforces blank-line style, too strict and subjective
    # - funlen        : function length, AGENTS.md already limits single-function responsibility
    # - cyclop/gocognit/gocyclo/maintidx : complexity; the hand-written HTML tokenizer
    #                  retains high complexity to avoid third-party dependencies, a reasonable tradeoff
    # - lll           : line length, AGENTS.md does not limit line length
    # - mnd           : magic numbers, standard library code uses many (e.g. 1<<20)
    # - exhaustruct   : structs must initialize all fields, too strict
    # - wrapcheck     : forces wrapping library errors, conflicts with project's "return errors directly" convention
    # - err113        : forces errors as sentinels, conflicts with project's "standard library first"
    # - tagliatelle   : JSON tag naming style, this project uses the already-fixed OpenAI schema
    # - nlreturn      : blank line before return, too strict
    # - nestif        : if nesting depth, too strict
    # - testpackage   : forces _test package name, violates the reasonable need for tests to access private fields
    # - paralleltest  : forces t.Parallel(), this project's tests have no parallelism needs
    # - depguard      : dependency whitelist, meaningless for a pure standard library project
    # - godoclint     : comment format, no godoc needs
    # - gosmopolitan  : i18n checks, project explicitly outputs in Chinese
    # - godot         : comments must end with a period, too strict
    # - godox         : forbids TODO/FIXME, too strict
    # - nolintlint    : makes nolint comment maintenance cost explode, not enabled by default
    # - ireturn       : forbids returning interfaces, too strict
    # - nonamedreturns: forbids named returns, too strict
    # - noinlineerr   : forbids inline err declarations, too strict
    # - nakedret      : forbids naked return, too strict
    # - dupl          : duplicate code detection, too noisy
    # - dogsled       : forbids _ placeholders, too strict
    # - gosec's G302/G304 etc. need file-level judgment, see settings handling
    #
    # The disable section below is the "blacklist" under --default=all mode: when default=standard
    # these linters would not be enabled anyway; this is only so that golangci-lint run --default=all
    # can also pass. Each item has a reason attached.

  disable:
    - depguard       # requires an explicit dependency whitelist; cmd referencing internal/miniagent is a normal monorepo structure
    - err113         # forces errors as sentinels, conflicts with project's "standard library first" convention
    - exhaustruct    # forces full-field struct initialization, too strict; structs like HTTPClient allow zero values
    - funcorder      # forces exported methods first; this project's tests rely on in-package method order, satisfied via refactor but unwilling to be constrained
    - gochecknoglobals # forbidding all package-level vars is too strict; version etc. are reasonable uses
    - gocognit       # cognitive complexity; the hand-written HTML tokenizer retains high complexity to avoid third-party dependencies
    - goconst        # JSON tag/map key/role strings recur by structural necessity; extracting constants reduces readability
    - gocyclo        # cyclomatic complexity; same as gocognit, hand-written tokenizer is a reasonable tradeoff
    - godoclint      # package comment format; project has no godoc needs
    - gosmopolitan   # i18n checks; project explicitly outputs in Chinese
    - lll            # line length; AGENTS.md does not limit line length
    - maintidx       # maintainability index; same as gocognit/gocyclo
    - mnd            # magic numbers; heavily used in standard library code and tool configs
    - nlreturn       # forces blank line before return/break/continue, too strict
    - noinlineerr    # forbids inline err declarations; conflicts with project's usual style
    - nolintlint     # nolint comment maintenance cost explodes, not enabled by default
    - nonamedreturns # forbids named returns; named returns like doOnce/doGetOnce express intent more clearly
    - paralleltest   # forces t.Parallel(); this project's tests have no parallelism needs
    - tagliatelle    # JSON tag naming style; this project uses the already-fixed OpenAI schema
    - testpackage    # forces _test package name; violates the reasonable need for tests to access private fields
    - varnamelen     # bans short variable names; violates Go idioms (i/n/s/m/sb)
    - wrapcheck      # forces wrapping library errors; conflicts with project's "return errors directly" convention
    - wsl            # enforces blank-line style (cuddling), too strict and subjective
    - wsl_v5         # the v5 version of wsl

  settings:
    # ===== Style linter thresholds relaxed to avoid conflicts with the project =====
    interfacebloat:
      max: 10          # default 10, kept

    gocritic:
      # Enable only high-confidence checks to avoid noise
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam       # large structs passed by value (no such issue in this project)
        - rangeValCopy    # range value copy (project accesses via index)

    revive:
      # Curated revive rules, avoiding overly strict ones
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-strings
        - name: error-return
        - name: errorf
        - name: exported
          disabled: true  # project has no godoc needs, do not force exported comments
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming

    # ===== gosec false positives precisely excluded (with real reasons) =====
    gosec:
      excludes:
        # G302/G301 file/directory permissions: write/edit using 0o644/0o750 are reasonable defaults;
        # tool files contain no sensitive info, tightening permissions yields no extra benefit.
        - G301
        - G302
        # G304 path variables: this form is free mode (README states no path boundary constraints);
        # the path source is the LLM rather than trusted input, and the responsibility for constraints falls to the caller (container/cgroup).
        # openNoFollow only rejects the final symlink segment, with no directory boundary validation.
        - G304
        # G602 slice out-of-bounds: estimateTokens has been removed (no memory layer), false-positive fallback retained.
        - G602
        # G204 tainted subprocess: the essence of the shell tool is to execute LLM commands; it already has
        # a 60s timeout + process-group SIGKILL cleanup; real isolation depends on the caller.
        - G204
        # G115 integer overflow conversion: platform.go flock/fd operations converting between int↔uintptr are
        # required by the syscall API, the fd value range is far from overflow, no real risk.
        - G115
        # G117 field name matches key pattern: APIKey is a struct field name (injected from env var/config),
        # not a hardcoded key constant, a naming necessity.
        - G117
        # G703 path traversal taint: memory/session tmpPath is generated by os.CreateTemp,
        # not LLM/user input; different from G304's user-facing paths.
        - G703
        # G704 SSRF taint: the request URL comes from config (trusted config), not LLM output;
        # miniagent is a CLI tool, the URL trust boundary is controlled by the caller.
        - G704
        # G705 XSS taint: fmt.Fprintf to os.Stderr (not an HTTP response body),
        # a CLI tool's stderr output has no XSS attack surface.
        - G705

  exclusions:
    # gosec built-in presets, already cover common false positives
    presets:
      - common-false-positives
      - legacy
      - std-error-handling

    rules:
      # Test code is relaxed: WriteFile permissions, ignoring ResponseWriter.Write return values, etc.
      # are testing conventions
      - path: _test\.go
        linters: [gosec, errcheck, noctx]
        text: "G306|G104|ResponseWriter"

      # main package command-line output: fmt.Println/Printf is a CLI tool's responsibility
      - path: ^cmd/
        linters: [gocritic]
        text: "fmt\\.Print|print|println"

      # errcheck checks on defer Close: the Go idiom is to close read-only then ignore the error;
      # using _ = to explicitly ignore already expresses intent
      - linters: [errcheck]
        text: "Close"

      # Default exclusion list (standard practice for golangci-lint v2)
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - goconst
          - gochecknoinits

issues:
  # Max issues shown per category, raised to view them all at once
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
  sort-order:
    - linter
    - file
